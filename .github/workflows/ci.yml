name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Rebuild main and publish latest plus an immutable source-SHA tag (no version tag or release)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.8.0
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.13.7
      - run: npm ci --ignore-scripts
      - name: Apply the production SDK adaptation before source tests
        run: python docker/apply-raumkernel-creation-errors.py
      - run: npm test
      - run: npm run smoke
      - run: python -m pip install uv==0.8.22
      - run: uv sync --project qobuz --frozen --no-dev
      - name: Apply the production player backports before source tests
        run: |
          qobuz/.venv/bin/python docker/apply-upstream-player-patch.py
          qobuz/.venv/bin/python docker/apply-upstream-seek-patch.py
          qobuz/.venv/bin/python docker/apply-upstream-paused-seek-patch.py
          qobuz/.venv/bin/python docker/apply-upstream-start-position-patch.py
      - run: qobuz/.venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH=. qobuz/.venv/bin/python tests/integration.py
      - run: python -m compileall -q qobuz docker
      - run: docker compose config --quiet
        env:
          API_TOKEN: ci-only-token-not-for-deployment-123456789
          LAN_ADDRESS: 192.0.2.2
      - run: docker build -t raumfeld-connect:ci .
      - name: Default upstream-first launcher, health and shutdown (synthetic data)
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e API_TOKEN=ci-only-token-not-for-deployment-123456789 \
            -e DISCOVERY_MODE=off -v "$PWD/tests:/tests:ro" \
            --entrypoint /app/qobuz/.venv/bin/python \
            raumfeld-connect:ci /tests/container_upstream_default.py
      - name: Container health, imports, and supervisor
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs raumfeld-ci; docker rm -f raumfeld-ci' EXIT
          docker run -d --name raumfeld-ci --read-only --tmpfs /tmp \
            -e PLAYBACK_PATH=guarded \
            -e API_TOKEN=ci-only-token-not-for-deployment-123456789 \
            -e DISCOVERY_MODE=off raumfeld-connect:ci
          healthy=false
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' raumfeld-ci)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          docker exec raumfeld-ci /app/qobuz/.venv/bin/python -c \
            "from qobuz_proxy.connect import DiscoveryService, WsManager; from qobuz_proxy.backends.base import AudioBackend"
          docker exec raumfeld-ci /app/qobuz/.venv/bin/python -c \
            "import os,asyncio; from qobuz.client import RaumfeldClient; s=asyncio.run(RaumfeldClient('http://127.0.0.1:8787',os.environ['API_TOKEN']).state()); assert s['capabilities']['playback'] is False; assert s['topologyFresh'] is False"
          docker exec raumfeld-ci /app/qobuz/.venv/bin/python -c \
            "import os,signal,pathlib; p=next(p for p in pathlib.Path('/proc').iterdir() if p.name.isdigit() and b'raumkernel/main.js' in (p/'cmdline').read_bytes().split(bytes([0]))); os.kill(int(p.name),signal.SIGKILL)"
          code=$(timeout 15 docker wait raumfeld-ci)
          test "$code" != 0
      - name: Real discovery initialization and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs raumfeld-discovery; docker rm -f raumfeld-discovery' EXIT
          docker run -d --name raumfeld-discovery --read-only --tmpfs /tmp \
            -e PLAYBACK_PATH=guarded \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e API_TOKEN=ci-only-token-not-for-deployment-123456789 raumfeld-connect:ci
          healthy=false
          for i in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' raumfeld-discovery)" = healthy ]; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          docker stop --time 12 raumfeld-discovery
          test "$(docker inspect --format '{{.State.ExitCode}}' raumfeld-discovery)" = 0
  publish:
    needs: test
    if: (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) || (github.event_name == 'workflow_dispatch' && inputs.publish_latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select publishing tags without replacing existing versions
        id: metadata
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ') }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_BUILD" = true ]; then
            test -z "$(git ls-remote origin "refs/tags/v$version")"
          fi
          {
            echo 'tags<<EOF'
            echo 'ghcr.io/tammuzgreeen/qobuz-raumfeld-connect:latest'
            echo "ghcr.io/tammuzgreeen/qobuz-raumfeld-connect:sha-$GITHUB_SHA"
            if [ "$RELEASE_BUILD" = true ]; then
              echo "ghcr.io/tammuzgreeen/qobuz-raumfeld-connect:$version"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PLAYBACK_PATH=upstream_first
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Verify published manifest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/tammuzgreeen/qobuz-raumfeld-connect@$DIGEST"
          echo "Image digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Create a new release only for an explicit release commit
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Raumfeld Connect $VERSION" --notes-file CHANGELOG.md
